name: Build desktop apps

# Builds the Apple Silicon (M1–M4) macOS app and the Windows 11 x64 installer.
# Runs on every push. Starting it from the Actions tab ("Run workflow") or
# pushing a v* tag also publishes a GitHub Release (v<package.json version>)
# with the installers attached.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner
            name: macOS-AppleSilicon
            args: --mac --arm64
          - os: windows-latest
            name: Windows11-x64
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # no Apple/Windows code-signing certificate: the Mac app is ad-hoc signed
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LaserCutX-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LaserCutX ${{ steps.v.outputs.tag }}
          make_latest: true
          body: |
            **Downloads**
            - **Mac (Apple Silicon M1–M4):** `LaserCutX-…-mac-arm64.dmg` – open it, drag LaserCutX to Applications, then right-click → Open the first time. If macOS says it is damaged, run `xattr -cr /Applications/LaserCutX.app` in Terminal.
            - **Windows 11:** `LaserCutX-Setup-…-win11-x64.exe` (installer) or `…-portable.exe` (no install). On the SmartScreen warning click *More info → Run anyway*.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
